<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Significant Figures Mastery Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .quiz-container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
            margin-top: 0;
        }
        h3 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            margin-top: 25px;
        }
        .progress-bar {
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-block {
            display: none;
        }
        .question-block.active {
            display: block;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #2d3748;
            line-height: 1.5;
        }
        .option-label {
            display: block;
            margin: 12px 0;
            padding: 14px;
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1em;
        }
        .option-label:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }
        .option-label input {
            margin-right: 12px;
            transform: scale(1.1);
        }
        .hint-details {
            margin: 15px 0;
            background: #edf2f7;
            border-radius: 6px;
            padding: 12px;
            font-size: 0.95em;
            color: #4a5568;
            border-left: 4px solid #4a5568;
        }
        .hint-summary {
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            outline: none;
        }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            line-height: 1.4;
        }
        .correct-style {
            border-color: #31c48d !important;
            background-color: #def7ec !important;
        }
        .incorrect-style {
            border-color: #f98080 !important;
            background-color: #fde8e8 !important;
        }
        .correct-feedback {
            display: block;
            background-color: #def7ec;
            color: #03543f;
            border-left: 4px solid #31c48d;
        }
        .incorrect-feedback {
            display: block;
            background-color: #fde8e8;
            color: #9b1c1c;
            border-left: 4px solid #f98080;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        button {
            padding: 12px 24px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #2980b9;
        }
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        #summaryBlock {
            display: none;
            text-align: center;
        }
        .score-display {
            font-size: 1.8em;
            font-weight: bold;
            color: #2b6cb0;
            margin: 20px 0;
            padding: 20px;
            background: #e8f4fd;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Significant Figures Mastery Quiz</h1>
    <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
    </div>
    
    <div id="quizForm">
        <div id="questionsContainer"></div>
        <div class="nav-buttons">
            <button id="backBtn" onclick="navigateQuestion(-1)">Back</button>
            <button id="nextBtn" onclick="navigateQuestion(1)">Next</button>
        </div>
    </div>

    <div id="summaryBlock">
        <h2>Quiz Completed!</h2>
        <div id="scoreText" class="score-display"></div>
        <button onclick="restartQuiz()">Restart Quiz</button>
    </div>

    <h3>Copyright 2026 Chris Athanas 
        <p>
        <a href="https://github.com/realityexpander/CHM-110-Significant-Figures-Quizlet/tree/main">link to source code</a>
    </h3>
</div>

<script>
    const quizData = [
        {
            q: "How many significant figures are in the measurement 0.003050 g?",
            options: ["3", "5", "4", "6"],
            correct: 2,
            hint: "Separate the leading zeros from the rest of the digits. Zeros at the end of a number after a decimal are significant.",
            feedback: [
                "Incorrect. Leading zeros are never significant placeholders.",
                "Incorrect. This overcounts leading placeholder zeros.",
                "Correct! The leading zeros are placeholders. The digits 3, 0, 5, and the final trailing zero after the decimal are significant.",
                "Incorrect. This counts every digit, including non-significant leading ones."
            ]
        },
        {
            q: "How many significant figures are in the number 402.105?",
            options: ["3", "4", "5", "6"],
            correct: 3,
            hint: "Zeros located between two non-zero digits are always significant.",
            feedback: [
                "Incorrect. Trapped zeros are always significant.",
                "Incorrect. Every digit listed is part of the precision measurement.",
                "Incorrect. Count all individual digits from left to right.",
                "Correct! All digits in 402.105 are significant because the zeros are trapped."
            ]
        },
        {
            q: "How many significant figures are in the value 3.020 × 10<sup>-4</sup> kg?",
            options: ["4", "3", "2", "7"],
            correct: 0,
            hint: "Focus exclusively on the coefficient part (3.020) and ignore the exponential multiplier.",
            feedback: [
                "Correct! In scientific notation, all digits in the coefficient are significant.",
                "Incorrect. Trailing decimal zeros in a coefficient count.",
                "Incorrect. Coefficients retain all explicitly written digits.",
                "Incorrect. The power of ten factor does not add to the sig figs."
            ]
        },
        {
            q: "The measurement 45,000 g is ambiguous. How do you write this in scientific notation to indicate exactly 3 significant figures?",
            options: ["4.5 × 10<sup>4</sup> g", "4.50 × 10<sup>4</sup> g", "4.500 × 10<sup>4</sup> g", "45.0 × 10<sup>3</sup> g"],
            correct: 1,
            hint: "Structure your coefficient with the desired number of digits. Ensure the coefficient sits between 1 and 10.",
            feedback: [
                "Incorrect. This format shows only 2 significant figures.",
                "Correct! 4.50 × 10^4 presents a coefficient with exactly 3 significant figures, clearing up ambiguity.",
                "Incorrect. This coefficient contains 4 significant figures.",
                "Incorrect. A proper scientific notation coefficient must be between 1 and 10."
            ]
        },
        {
            q: "A distance is 700,000 m. Express it with an explicit precision of 4 significant figures.",
            options: ["7.0 × 10<sup>5</sup> m", "7.00 × 10<sup>5</sup> m", "7.000 × 10<sup>5</sup> m", "7 × 10<sup>5</sup> m"],
            correct: 2,
            hint: "Count the number of digits inside the coefficient to construct exactly four significant figures.",
            feedback: [
                "Incorrect. This provides only 2 significant figures.",
                "Incorrect. This gives 3 significant figures.",
                "Correct! Writing the coefficient as 7.000 yields exactly 4 significant figures while preserving the scale.",
                "Incorrect. This reduces the value to a single significant figure."
            ]
        },
        {
            q: "How must the value 3000 L be written in scientific notation to show exactly 2 significant figures?",
            options: ["3 × 10<sup>3</sup> L", "3.000 × 10<sup>3</sup> L", "3.00 × 10<sup>3</sup> L", "3.0 × 10<sup>3</sup> L"],
            correct: 3,
            hint: "Match the total number of digits in the coefficient to your target significant figure constraint.",
            feedback: [
                "Incorrect. This coefficient shows only 1 significant figure.",
                "Incorrect. This implies 4 significant figures.",
                "Incorrect. This shows 3 significant figures.",
                "Correct! The coefficient 3.0 has exactly 2 significant figures, providing an unambiguous format."
            ]
        },
        {
            q: "What is the sum of 14.2 mL, 8.35 mL, and 1.021 mL, reported to the correct number of decimal places?",
            options: ["23.6 mL", "23.571 mL", "23.57 mL", "24 mL"],
            correct: 0,
            hint: "For addition, the result is limited by the measurement with the fewest decimal places.",
            feedback: [
                "Correct! The raw sum is 23.571 mL. 14.2 mL limits the precision to one decimal place, so we round to 23.6 mL.",
                "Incorrect. This is the raw calculation without significant figure rules applied.",
                "Incorrect. This retains two decimal places, which exceeds 14.2 mL precision.",
                "Incorrect. This rounds too aggressively to whole numbers."
            ]
        },
        {
            q: "Evaluate the subtraction problem: 352.4 g - 7.15 g.",
            options: ["345.25 g", "345.3 g", "345 g", "345.2 g"],
            correct: 1,
            hint: "Check the number of decimal places in both terms. Round your final result to match the lesser decimal place count.",
            feedback: [
                "Incorrect. This retains unrounded digits beyond the limiting decimal place.",
                "Correct! The raw difference is 345.25 g. 352.4 g limits the precision to the tenths place, so it rounds to 345.3 g.",
                "Incorrect. This rounds away the valid tenths place value.",
                "Incorrect. This fails to round the 2 up based on the following digit 5."
            ]
        },
        {
            q: "What is the area of a floor measuring 4.2 m by 5.65 m?",
            options: ["23.73 m²", "23.7 m²", "24 m²", "23 m²"],
            correct: 2,
            hint: "Multiplication uses total significant figure counts. Round to match the factor with the fewest total sig figs.",
            feedback: [
                "Incorrect. This is the unrounded calculator value.",
                "Incorrect. This retains 3 sig figs, but 4.2 has only 2 sig figs.",
                "Correct! The raw product is 23.73 m². 4.2 m has 2 sig figs, requiring the answer to round to 24 m².",
                "Incorrect. This rounds down incorrectly; 23.73 must round up."
            ]
        },
        {
            q: "Calculate the density of an object with a mass of 18.4 g and a volume of 2.3 mL.",
            options: ["7.99 g/mL", "8 g/mL", "8.00 g/mL", "8.0 g/mL"],
            correct: 3,
            hint: "Density equals mass divided by volume. Look for the input with the minimum total significant figure count.",
            feedback: [
                "Incorrect. This is a mathematical miscalculation.",
                "Incorrect. Writing 8 drops the necessary decimal precision.",
                "Incorrect. This overstates precision by implying 3 significant figures.",
                "Correct! Mass has 3 sig figs, volume has 2. The quotient must be limited to 2 sig figs, giving 8.0 g/mL."
            ]
        },
        {
            q: "How many significant figures are in the whole number 52,000?",
            options: ["2", "5", "3", "4"],
            correct: 0,
            hint: "Zeros at the end of a whole integer without a visible decimal point are placeholders.",
            feedback: [
                "Correct! Trailing zeros in a whole number without a decimal are placeholders, leaving only 5 and 2.",
                "Incorrect. This counts all placeholder zeros.",
                "Incorrect. Trailing zeros without a decimal do not count.",
                "Incorrect. Only the non-zero digits are significant here."
            ]
        },
        {
            q: "How many significant figures are in the value 500.?",
            options: ["1", "2", "3", "Infinite"],
            correct: 2,
            hint: "An explicitly written decimal point at the very end makes trailing zeros significant.",
            feedback: [
                "Incorrect. The decimal point indicates the zeros were explicitly measured.",
                "Incorrect. The decimal point applies to all trailing zeros preceding it.",
                "Correct! The terminal decimal point marks all trailing zeros as significant, yielding 3 sig figs.",
                "Incorrect. This is a physical measurement, not an exact constant."
            ]
        },
        {
            q: "Multiply 1.5 × 2.00. Express the answer to the correct number of significant figures.",
            options: ["3", "3.0", "3.00", "3.000"],
            correct: 1,
            hint: "Count total significant figures in both terms and use the lower total to limit your output.",
            feedback: [
                "Incorrect. This drops essential precision.",
                "Correct! 1.5 contains 2 significant figures. Multiplication defaults to the lower total count (2), resulting in 3.0.",
                "Incorrect. This carries 3 significant figures, violating the limit set by 1.5.",
                "Incorrect. This overstates precision significantly."
            ]
        },
        {
            q: "Calculate 10.000 ÷ 2.0 and report the answer with the correct precision limits.",
            options: ["5", "5.0", "5.00", "5.000"],
            correct: 1,
            hint: "Count total significant digits in both terms. The less precise term rules the output layout.",
            feedback: [
                "Incorrect. This only reflects 1 significant figure.",
                "Correct! 10.000 has 5 sig figs, but 2.0 has only 2. The result must match the minimum total count (2), giving 5.0.",
                "Incorrect. This overrepresents the limitations dictated by 2.0.",
                "Incorrect. This ignores division rules."
            ]
        },
        {
            q: "Express the decimal value 0.000034 in proper scientific notation while preserving sig figs.",
            options: ["34 × 10<sup>-6</sup>", "3.4 × 10<sup>-5</sup>", "3.40 × 10<sup>-5</sup>", "0.34 × 10<sup>-4</sup>"],
            correct: 1,
            hint: "Identify the significant digits first. Your coefficient must sit strictly between 1 and 10.",
            feedback: [
                "Incorrect. The coefficient must be a number between 1 and 10.",
                "Correct! 0.000034 contains exactly 2 sig figs. Moving the decimal 5 places right yields 3.4 × 10^-5.",
                "Incorrect. Adding a trailing zero changes the precision to 3 significant figures.",
                "Incorrect. Scientific notation requires a single non-zero digit to the left of the decimal."
            ]
        },
        {
            q: "Evaluate the addition operation 100.5 + 0.025 and apply the proper rounding constraints.",
            options: ["100.525", "100.53", "100.5", "101"],
            correct: 2,
            hint: "Focus entirely on positions after the decimal point. The least precise column depth rules.",
            feedback: [
                "Incorrect. This is the unrounded calculator output.",
                "Incorrect. Addition focuses on decimal places, not significant figure totals.",
                "Correct! 100.5 has 1 decimal place, so 100.525 rounds down to 100.5.",
                "Incorrect. This rounds away valid tenths-place details."
            ]
        },
        {
            q: "Perform the multi-step operation: (2.50 × 4.0) ÷ 1.234.",
            options: ["8.1037", "8.10", "8.1", "8"],
            correct: 2,
            hint: "Track sig figs step by step. The product inside the parentheses establishes constraints before dividing.",
            feedback: [
                "Incorrect. This is unrounded calculator output.",
                "Incorrect. Review the limiting intermediate step counts.",
                "Correct! The product (2.50 × 4.0) evaluates to 10. (limited to 2 sig figs by 4.0). Then, 10. ÷ 1.234 forces the final answer to keep 2 sig figs, yielding 8.1.",
                "Incorrect. This undercuts precision down to a single digit."
            ]
        },
        {
            q: "How many significant figures are in an exact conversion factor definition, such as 1 inch = 2.54 cm?",
            options: ["1", "3", "4", "Infinite"],
            correct: 3,
            hint: "Defined conversions are absolute definitions, not estimated measurements.",
            feedback: [
                "Incorrect. Defined conversions are not approximated values.",
                "Incorrect. Do not apply standard measuring rules to unit definitions.",
                "Incorrect. Definitions do not limit calculation precision.",
                "Correct! Pure definitions, counting constants, or exact items possess infinite significant figures and never limit precision calculations."
            ]
        },
        {
            q: "Multiply (6.02 × 10<sup>23</sup>) × (2.0 × 10<sup>-2</sup>) and express the result in proper scientific notation.",
            options: ["1.204 × 10<sup>22</sup>", "1.20 × 10<sup>22</sup>", "1.2 × 10<sup>22</sup>", "12 × 10<sup>21</sup>"],
            correct: 2,
            hint: "The multiplier with fewer total digits determines final rounding constraints.",
            feedback: [
                "Incorrect. This retains 4 sig figs, which exceeds the limitation set by 2.0.",
                "Incorrect. This implies 3 significant figures of precision.",
                "Correct! 6.02 has 3 sig figs, while 2.0 has 2. The product must contain 2 significant figures, giving 1.2 × 10^22.",
                "Incorrect. The coefficient must remain between 1 and 10."
            ]
        },
        {
            q: "How many significant figures are in the ultra-small measurement 0.0000007 m?",
            options: ["1", "7", "8", "Ambiguous"],
            correct: 0,
            hint: "Are leading zeros considered active accuracy numbers or standard placeholders?",
            feedback: [
                "Correct! All leading zeros in a decimal scale are purely positional placeholders. Only the digit 7 is significant, yielding 1 sig fig.",
                "Incorrect. This counts positional placeholder zeros.",
                "Incorrect. Do not count leading zeros.",
                "Incorrect. Small decimal measurements with non-zero terminal numbers are unambiguous."
            ]
        }
    ];

    let currentQuestionIdx = 0;
    let initialChoices = Array(quizData.length).fill(null); // Tracks the scored option
    let lastChoices = Array(quizData.length).fill(null);    // Tracks active visual state

    function initQuiz() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        currentQuestionIdx = 0;
        initialChoices.fill(null);
        lastChoices.fill(null);
        
        quizData.forEach((item, qIdx) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${qIdx === 0 ? 'active' : ''}`;
            qBlock.id = `qBlock${qIdx}`;
            
            let optionsHTML = '';
            item.options.forEach((opt, oIdx) => {
                optionsHTML += `
                    <label class="option-label" id="label_${qIdx}_${oIdx}">
                        <input type="radio" name="qRadio${qIdx}" value="${oIdx}" onclick="handleOptionSelection(${oIdx})">
                        ${opt}
                    </label>
                `;
            });
            
            qBlock.innerHTML = `
                <div class="question-text">${qIdx + 1}. ${item.q}</div>
                ${optionsHTML}
                <details class="hint-details" id="hint_${qIdx}">
                    <summary class="hint-summary">💡 Need a Hint?</summary>
                    <p style="margin: 8px 0 0 0;">${item.hint}</p>
                </details>
                <div id="feedbackBox${qIdx}" class="feedback"></div>
            `;
            container.appendChild(qBlock);
        });

        document.getElementById('quizForm').style.display = 'block';
        document.getElementById('summaryBlock').style.display = 'none';
        updateNavigationState();
    }

    function handleOptionSelection(optionIdx) {
        const currentItem = quizData[currentQuestionIdx];
        
        // 1. Lock and score only the very first action
        if (initialChoices[currentQuestionIdx] === null) {
            initialChoices[currentQuestionIdx] = optionIdx;
        }
        
        // 2. Log last choice to update active UI display elements
        lastChoices[currentQuestionIdx] = optionIdx;
        
        // 3. Clean active state layout borders
        currentItem.options.forEach((_, oIdx) => {
            const lbl = document.getElementById(`label_${currentQuestionIdx}_${oIdx}`);
            lbl.className = "option-label";
        });
        
        // 4. Update the layout feedback block based on the last selected choice
        const feedbackBox = document.getElementById(`feedbackBox${currentQuestionIdx}`);
        feedbackBox.innerHTML = currentItem.feedback[optionIdx];
        
        const activeLabel = document.getElementById(`label_${currentQuestionIdx}_${optionIdx}`);
        if (optionIdx === currentItem.correct) {
            feedbackBox.className = "feedback correct-feedback";
            activeLabel.classList.add("correct-style");
        } else {
            feedbackBox.className = "feedback incorrect-feedback";
            activeLabel.classList.add("incorrect-style");
            // Show the correct selection subtly alongside the mistake
            document.getElementById(`label_${currentQuestionIdx}_${currentItem.correct}`).classList.add("correct-style");
        }
    }

    function updateNavigationState() {
        const backBtn = document.getElementById('backBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        
        progressFill.style.width = `${(currentQuestionIdx / quizData.length) * 100}%`;
        backBtn.disabled = currentQuestionIdx === 0;
        
        if (currentQuestionIdx === quizData.length - 1) {
            nextBtn.innerText = "Finish Quiz";
        } else {
            nextBtn.innerText = "Next";
        }
    }

    function navigateQuestion(direction) {
        // Auto-close hints accordion box when changing active positions
        const hintBox = document.getElementById`hint_${currentQuestionIdx}`;
        if (hintBox) hintBox.removeAttribute('open');

        if (direction === 1 && currentQuestionIdx === quizData.length - 1) {
            showFinalSummary();
            return;
        }
        
        const currentBlock = document.getElementById(`qBlock${currentQuestionIdx}`);
        currentBlock.classList.remove('active');
        
        currentQuestionIdx += direction;
        
        const nextBlock = document.getElementById(`qBlock${currentQuestionIdx}`);
        nextBlock.classList.add('active');
        
        updateNavigationState();
    }

    function showFinalSummary() {
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('quizForm').style.display = 'none';
        
        // Calculate the score based ONLY on the initial selections
        let finalScore = 0;
        quizData.forEach((item, idx) => {
            if (initialChoices[idx] === item.correct) {
                finalScore++;
            }
        });
        
        const summaryBlock = document.getElementById('summaryBlock');
        const scoreText = document.getElementById('scoreText');
        
        summaryBlock.style.display = 'block';
        scoreText.innerText = `Your Final Score: ${finalScore} / ${quizData.length}`;
    }

    function restartQuiz() {
        initQuiz();
    }

    window.onload = initQuiz;
</script>

</body>
</html>
